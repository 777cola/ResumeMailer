name: build-intel

# Intel Mac 的构建机器排队很久，单独跑，完成后在 Actions 页面下载 artifact，
# 需要的话再手动挂到 Release 上，避免拖住正式发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/resumemailer.spec --noconfirm
      - run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ResumeMailer.app ResumeMailer-macos-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeMailer-macos-x64
          path: dist/ResumeMailer-macos-x64.zip
