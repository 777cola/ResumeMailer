name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 构建
        run: pyinstaller packaging/resumemailer.spec --noconfirm

      - name: 冒烟测试 macOS
        if: runner.os == 'macOS'
        env:
          RESUMEMAILER_NO_BROWSER: "1"
          PORT: "8765"
        run: |
          dist/ResumeMailer.app/Contents/MacOS/ResumeMailer > /tmp/app.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 1
            if curl -sf http://127.0.0.1:8765/healthz > /dev/null; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo "健康检查失败"; cat /tmp/app.log; exit 1; fi
          curl -sf http://127.0.0.1:8765/ > /dev/null
          curl -sf http://127.0.0.1:8765/static/app.js > /dev/null
          curl -sf http://127.0.0.1:8765/static/example-sent-email.png > /dev/null
          python3 - <<'PY'
          import json, urllib.request
          cfg = json.load(urllib.request.urlopen("http://127.0.0.1:8765/api/config"))
          assert cfg["version"] != "dev", cfg["version"]
          print("version", cfg["version"])
          PY
          kill $APP_PID || true

      - name: 冒烟测试 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RESUMEMAILER_NO_BROWSER: "1"
          PORT: "8765"
        run: |
          $p = Start-Process -FilePath "dist\ResumeMailer\ResumeMailer.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/healthz" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "健康检查失败：打包后的程序没起来" }
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/" | Out-Null
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/static/app.js" | Out-Null
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/static/example-sent-email.png" | Out-Null
          $cfg = Invoke-RestMethod "http://127.0.0.1:8765/api/config"
          if ($cfg.version -eq "dev") { Stop-Process -Id $p.Id -Force; throw "版本号没打进包里" }
          Write-Host "version $($cfg.version)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: 打包 macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ResumeMailer.app ResumeMailer-${{ matrix.name }}.zip

      - name: 打包 Windows
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a ResumeMailer-${{ matrix.name }}.zip ResumeMailer

      - uses: actions/upload-artifact@v4
        with:
          name: ResumeMailer-${{ matrix.name }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
